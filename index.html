<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>&nbsp;</title>
<style>
  :root {
    --bg: #060402;
    --amber: #ffb347;
    --amber-dim: #a3712a;
    --amber-faint: #5c4319;
    --red: #ff4d2e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--amber);
    font-family: "Courier New", Courier, monospace;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  #crt {
    position: relative;
    width: 100%;
    max-width: 720px;
    background: #0a0603;
    border: 1px solid var(--amber-faint);
    border-radius: 4px;
    padding: 28px 30px;
    box-shadow: 0 0 40px rgba(255,140,40,0.08), inset 0 0 60px rgba(0,0,0,0.6);
    min-height: 420px;
  }
  #crt::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.03) 0px,
      rgba(255,255,255,0.03) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
    border-radius: 4px;
  }
  #crt::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 120px rgba(0,0,0,0.7);
    border-radius: 4px;
  }
  #log {
    white-space: pre-wrap;
    font-size: 15px;
    line-height: 1.55;
    min-height: 220px;
  }
  #log .dim { color: var(--amber-dim); }
  #log .warn { color: var(--red); }
  .cursor {
    display: inline-block;
    width: 8px; height: 14px;
    background: var(--amber);
    animation: blink 1s steps(1) infinite;
    vertical-align: -2px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  #gate {
    margin-top: 18px;
    display: none;
    align-items: center;
    gap: 8px;
  }
  #gate.show { display: flex; }
  #gate .prompt { color: var(--amber); font-size: 15px; }
  #gate input {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--amber-faint);
    color: var(--amber);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    padding: 2px 4px;
    letter-spacing: 1px;
  }
  #denied {
    color: var(--red);
    font-size: 13px;
    margin-top: 10px;
    min-height: 16px;
    opacity: 0;
  }
  #denied.show {
    opacity: 1;
    animation: shake 0.35s;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  #reveal {
    display: none;
    margin-top: 6px;
    white-space: pre-wrap;
    font-size: 15px;
    line-height: 1.6;
    color: var(--amber);
  }
  #reveal.show { display: block; }
  #reveal .quiet { color: var(--amber-dim); font-size: 13px; }

  @media (max-width: 480px) {
    #crt { padding: 20px; min-height: 380px; }
    #log, #reveal { font-size: 13.5px; }
  }

  #start {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    cursor: pointer;
  }
  #start.hidden {
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.2s ease;
  }
  #start span {
    color: var(--amber-dim);
    font-size: 15px;
    letter-spacing: 1px;
  }

  #hidden-btn {
    position: fixed;
    right: 14px;
    bottom: 12px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #08050a;
    border: none;
    cursor: pointer;
    padding: 0;
    z-index: 5;
  }
  #hidden-btn:hover { background: var(--amber-faint); }
  #hidden-msg {
    position: fixed;
    right: 14px;
    bottom: 30px;
    max-width: 260px;
    font-size: 12px;
    color: var(--red);
    text-align: right;
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 5;
  }
  #hidden-msg.show { opacity: 1; }
</style>
</head>
<body>
<div id="start"><span>[ klik om verbinding te starten ]<span class="cursor"></span></span></div>
<div id="crt">
  <div id="log"></div>
  <div id="gate">
    <span class="prompt">&gt;</span>
    <input type="text" id="pw" autocomplete="off" spellcheck="false" autofocus>
  </div>
  <div id="denied"></div>
  <div id="reveal"></div>
</div>
<button id="hidden-btn" aria-label=""></button>
<div id="hidden-msg"></div>

<script>
const bootLines = [
  { t: "verbinding zoeken", dim: true, delay: 40 },
  { t: "verbinding zoeken.", dim: true, delay: 300 },
  { t: "verbinding zoeken..", dim: true, delay: 300 },
  { t: "verbinding zoeken...", dim: true, delay: 300 },
  { t: "signaal gevonden onder maurice's huis", delay: 700 },
  { t: "diepte: onbekend", dim: true, delay: 500 },
  { t: "oorsprong: hetzelfde als wat jij al kent", delay: 900 },
  { t: "", delay: 400 },
  { t: "dit is niet begonnen bij jou.", delay: 800 },
  { t: "het was er al, en het groeit nog steeds.", delay: 1000 },
  { t: "", delay: 500 },
  { t: "WAARSCHUWING: toegang vereist bevestiging", warn: true, delay: 700 },
];

const log = document.getElementById("log");
const gate = document.getElementById("gate");
const pwInput = document.getElementById("pw");
const denied = document.getElementById("denied");
const reveal = document.getElementById("reveal");

function appendLine(html) {
  const div = document.createElement("div");
  div.innerHTML = html;
  log.appendChild(div);
}

async function playBoot() {
  for (const line of bootLines) {
    await new Promise(r => setTimeout(r, line.delay));
    const cls = line.warn ? "warn" : (line.dim ? "dim" : "");
    appendLine(`<span class="${cls}">${line.t}</span>`);
  }
  await new Promise(r => setTimeout(r, 400));
  appendLine(`<span class="dim">typ het woord dat je hoorde onder de grond<span class="cursor"></span></span>`);
  gate.classList.add("show");
  pwInput.focus();
}

let attempts = 0;
const ANSWER = "under";

pwInput.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const val = pwInput.value.trim().toLowerCase();
  if (val === ANSWER || val === "onder") {
    unlock();
  } else {
    attempts++;
    denied.textContent = attempts < 3
      ? "TOEGANG GEWEIGERD"
      : "TOEGANG GEWEIGERD — luister nog eens";
    denied.classList.remove("show");
    void denied.offsetWidth;
    denied.classList.add("show");
    pwInput.value = "";
  }
});

const revealLines = [
  { t: "toegang verleend", dim: true, delay: 300 },
  { t: "", delay: 500 },
  { t: "het zit niet alleen bij mij.", delay: 900 },
  { t: "het zat hier al, onder ons allebei,", delay: 900 },
  { t: "lang voordat een van ons het merkte.", delay: 1100 },
  { t: "", delay: 600 },
  { t: "volg het terug. je weet al waar het eindigt —", delay: 900 },
  { t: "bij de deur die je al bent gepasseerd.", delay: 1200 },
  { t: "", delay: 700 },
  { t: "als je dit leest, is het al te laat.", warn: true, delay: 900 },
  { t: "ga op zoek naar een tweede laag.", warn: true, delay: 1200 },
  { t: "", delay: 800 },
  { t: "&lt;!-- er zit meer verborgen dan dit scherm toont --&gt;", dim: true, delay: 1300 },
  { t: "", delay: 800 },
  { t: "[verbinding verbroken]", dim: true, delay: 700 },
];

async function unlock() {
  gate.remove();
  denied.remove();
  reveal.classList.add("show");
  for (const line of revealLines) {
    await new Promise(r => setTimeout(r, line.delay));
    const cls = line.warn ? "warn" : (line.dim ? "dim" : "");
    const div = document.createElement("div");
    div.innerHTML = `<span class="${cls}">${line.t || "&nbsp;"}</span>`;
    reveal.appendChild(div);
  }
}

const hiddenBtn = document.getElementById("hidden-btn");
const hiddenMsg = document.getElementById("hidden-msg");
let hiddenFound = false;
hiddenBtn.addEventListener("click", () => {
  if (hiddenFound) return;
  hiddenFound = true;
  hiddenMsg.textContent = "je hebt de knop gevonden. er is er nog een — achter een kist.";
  hiddenMsg.classList.add("show");
});

const startOverlay = document.getElementById("start");
const ambient = new Audio("ambient.mp3");
ambient.loop = true;
ambient.volume = 0;

startOverlay.addEventListener("click", () => {
  startOverlay.classList.add("hidden");
  ambient.play().catch(() => {});
  let vol = 0;
  const target = 0.35;
  const rampId = setInterval(() => {
    vol = Math.min(target, vol + 0.02);
    ambient.volume = vol;
    if (vol >= target) clearInterval(rampId);
  }, 100);
  playBoot();
}, { once: true });
</script>
</body>
</html>
